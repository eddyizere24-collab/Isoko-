#cloud-config
package_update: true
package_upgrade: true

packages:
  - ca-certificates
  - curl
  - docker.io
  - docker-compose-v2
  - unattended-upgrades
  - fail2ban

runcmd:
  - [systemctl, enable, --now, docker]
  - [usermod, -aG, docker, ubuntu]
  - [systemctl, enable, --now, unattended-upgrades]
  - [systemctl, enable, --now, fail2ban]
