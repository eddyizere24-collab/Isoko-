# ISOKO public Production static site.
# Served from Render's global static CDN; static sites do not spin down on idle.
services:
  - type: web
    name: isoko-marketplace
    runtime: static
    branch: main
    buildCommand: bun install --frozen-lockfile && bun run build
    staticPublishPath: dist
    autoDeploy: true
    envVars:
      - key: VITE_ISOKO_PREVIEW
        value: "false"
      - key: VITE_ISOKO_SELLER_REGISTRATION_ENABLED
        value: "true"
      - key: VITE_NEON_AUTH_URL
        value: https://ep-damp-poetry-ba0bdwcn.neonauth.c-8.eu-central-1.aws.neon.tech/isoko/auth
      - key: VITE_NEON_DATA_API_URL
        value: https://ep-damp-poetry-ba0bdwcn.apirest.c-8.eu-central-1.aws.neon.tech/isoko/rest/v1
      - key: VITE_NEON_FUNCTION_URL
        value: https://br-blue-bread-ba2wywua-isokoapi.compute.c-8.eu-central-1.aws.neon.tech/
      - key: VITE_NEON_PUBLIC_STORAGE_URL
        value: https://br-blue-bread-ba2wywua.storage.c-8.eu-central-1.aws.neon.tech/isoko-public-assets/
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
