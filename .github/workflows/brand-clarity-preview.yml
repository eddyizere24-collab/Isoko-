name: ISOKO brand clarity preview

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/brand-clarity-preview.yml'
      - 'playwright.brand-preview.config.cjs'
      - 'e2e/brand-clarity-preview.spec.cjs'
      - 'src/index.css'
      - 'src/pages/HomePage.tsx'
      - 'src/components/ProductCard.tsx'
      - 'src/components/IsokoLogo.tsx'

permissions:
  contents: write

jobs:
  brand-preview:
    name: Redesign preview screenshots on Production data
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Install Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build redesign against read-only Production public endpoints
        run: bun run build
        env:
          VITE_ISOKO_PREVIEW: "false"
          VITE_NEON_AUTH_URL: https://ep-damp-poetry-ba0bdwcn.neonauth.c-8.eu-central-1.aws.neon.tech/isoko/auth
          VITE_NEON_DATA_API_URL: https://ep-damp-poetry-ba0bdwcn.apirest.c-8.eu-central-1.aws.neon.tech/isoko/rest/v1
          VITE_NEON_FUNCTION_URL: https://br-blue-bread-ba2wywua-isokoapi.compute.c-8.eu-central-1.aws.neon.tech/
          VITE_NEON_PUBLIC_STORAGE_URL: https://br-blue-bread-ba2wywua.storage.c-8.eu-central-1.aws.neon.tech/isoko-public-assets/

      - name: Install Playwright
        run: |
          mkdir -p "$RUNNER_TEMP/isoko-brand-playwright"
          npm install --prefix "$RUNNER_TEMP/isoko-brand-playwright" --no-save --no-package-lock --ignore-scripts --no-audit --no-fund @playwright/test@1.65.0

      - name: Install Chromium
        run: '"$RUNNER_TEMP/isoko-brand-playwright/node_modules/.bin/playwright" install --with-deps chromium'

      - name: Capture after screenshots and validate mobile layout
        env:
          NODE_PATH: ${{ runner.temp }}/isoko-brand-playwright/node_modules
        run: '"$RUNNER_TEMP/isoko-brand-playwright/node_modules/.bin/playwright" test --config=playwright.brand-preview.config.cjs'

      - name: Save screenshot evidence to PR branch
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          qa_dir="docs/design/qa/2026-11-16-after"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$qa_dir"
          git commit -m "test(design): save redesign preview screenshots"
          git push origin "HEAD:$HEAD_BRANCH"
