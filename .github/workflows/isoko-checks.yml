name: ISOKO checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "infra/**", "feature/**", "docs/**", "fix/**"]

permissions:
  contents: read

jobs:
  validate:
    name: TypeScript and Vite build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript check
        run: bun run lint

      - name: Unit tests
        run: bun test src/lib/*.test.ts

      - name: Verify isolated Neon setup branch
        run: bun infra/neon/smoke-test.mjs
        env:
          ISOKO_TEST_AUTH_URL: https://ep-divine-salad-ba2n73kh.neonauth.c-8.eu-central-1.aws.neon.tech/isoko/auth
          ISOKO_TEST_DATA_API_URL: https://ep-divine-salad-ba2n73kh.apirest.c-8.eu-central-1.aws.neon.tech/isoko/rest/v1
          ISOKO_TEST_FUNCTION_URL: https://br-raspy-resonance-baqfwhuh-isokoapi.compute.c-8.eu-central-1.aws.neon.tech/
          ISOKO_EXPECTED_NEON_BRANCH: isoko-setup

      - name: Verify live Neon production branch
        run: bun infra/neon/smoke-test.mjs
        env:
          ISOKO_TEST_AUTH_URL: https://ep-damp-poetry-ba0bdwcn.neonauth.c-8.eu-central-1.aws.neon.tech/isoko/auth
          ISOKO_TEST_DATA_API_URL: https://ep-damp-poetry-ba0bdwcn.apirest.c-8.eu-central-1.aws.neon.tech/isoko/rest/v1
          ISOKO_TEST_FUNCTION_URL: https://br-blue-bread-ba2wywua-isokoapi.compute.c-8.eu-central-1.aws.neon.tech/
          ISOKO_EXPECTED_NEON_BRANCH: isoko-production


      - name: Verify seller-upload CORS on live Production branch
        run: bun infra/neon/cors-smoke-test.mjs
        env:
          ISOKO_TEST_FUNCTION_URL: https://br-blue-bread-ba2wywua-isokoapi.compute.c-8.eu-central-1.aws.neon.tech/
          ISOKO_EXPECTED_WEB_ORIGIN: https://isoko-marketplace-9i69.onrender.com

      # This child branch is a disposable clone of Production. Browser tests can
      # create seller accounts, write images and publish products without touching Production.
      - name: Verify seller-upload CORS on isolated Production clone
        run: bun infra/neon/cors-smoke-test.mjs
        env:
          ISOKO_TEST_FUNCTION_URL: https://br-cold-forest-badn9wlr-isokoapi.compute.c-8.eu-central-1.aws.neon.tech/
          ISOKO_EXPECTED_WEB_ORIGIN: http://127.0.0.1:4173

      - name: Build UI for full seller-journey E2E (isolated Production clone)
        run: bun run build
        env:
          VITE_NEON_AUTH_URL: https://ep-jolly-poetry-ba3o1jwc.neonauth.c-8.eu-central-1.aws.neon.tech/isoko/auth
          VITE_NEON_DATA_API_URL: https://ep-jolly-poetry-ba3o1jwc.apirest.c-8.eu-central-1.aws.neon.tech/isoko/rest/v1
          VITE_NEON_FUNCTION_URL: https://br-cold-forest-badn9wlr-isokoapi.compute.c-8.eu-central-1.aws.neon.tech/
          VITE_NEON_PUBLIC_STORAGE_URL: https://br-cold-forest-badn9wlr.storage.c-8.eu-central-1.aws.neon.tech/isoko-public-assets/

      - name: Install Playwright for browser smoke tests
        run: |
          mkdir -p "$RUNNER_TEMP/isoko-playwright"
          npm install --prefix "$RUNNER_TEMP/isoko-playwright" --no-save --no-package-lock --ignore-scripts --no-audit --no-fund @playwright/test@1.65.0

      - name: Install Chromium for browser smoke tests
        run: '"$RUNNER_TEMP/isoko-playwright/node_modules/.bin/playwright" install --with-deps chromium'

      - name: Run Playwright browser smoke tests
        env:
          NODE_PATH: ${{ runner.temp }}/isoko-playwright/node_modules
        run: '"$RUNNER_TEMP/isoko-playwright/node_modules/.bin/playwright" test --config=playwright.config.cjs --workers=1'

      - name: Install pinned Neon Function dependency
        run: npm install --prefix infra/neon/functions/isokoapi --no-save --no-package-lock --ignore-scripts --no-audit --no-fund

      - name: Bundle Node.js 24 Neon Function
        run: |
          mkdir -p "$RUNNER_TEMP/isoko-neon-function"
          bun build infra/neon/functions/isokoapi/index.mjs --target=node --minify --outfile "$RUNNER_TEMP/isoko-neon-function/index.mjs"
          cd "$RUNNER_TEMP/isoko-neon-function"
          zip -q -9 "$RUNNER_TEMP/isoko-neon-function.zip" index.mjs

      - name: Publish Production Function bundle artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: isoko-neon-function-bundle
          path: ${{ runner.temp }}/isoko-neon-function.zip
          if-no-files-found: error
          retention-days: 7
