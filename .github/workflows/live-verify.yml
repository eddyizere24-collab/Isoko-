name: ISOKO live verify (on demand)

# Runs only when a branch named verify-live/* is pushed. It opens the public
# Production site read-only at phone sizes, saves screenshots and commits them
# back to that same verify-live/* branch so they can be reviewed afterwards.
on:
  push:
    branches:
      - 'verify-live/**'

permissions:
  contents: write

jobs:
  live-verify:
    name: Live public pages at 360x800 and 320x800
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Playwright
        run: |
          mkdir -p "$RUNNER_TEMP/isoko-live-playwright"
          npm install --prefix "$RUNNER_TEMP/isoko-live-playwright" --no-save --no-package-lock --ignore-scripts --no-audit --no-fund @playwright/test@1.65.0

      - name: Install Chromium
        run: '"$RUNNER_TEMP/isoko-live-playwright/node_modules/.bin/playwright" install --with-deps chromium'

      - name: Capture live pages and all seven languages
        id: capture
        continue-on-error: true
        env:
          NODE_PATH: ${{ runner.temp }}/isoko-live-playwright/node_modules
        run: '"$RUNNER_TEMP/isoko-live-playwright/node_modules/.bin/playwright" test --config=playwright.live.config.cjs'

      - name: Audit leftover Kinyarwanda in every other language
        continue-on-error: true
        env:
          NODE_PATH: ${{ runner.temp }}/isoko-live-playwright/node_modules
        run: '"$RUNNER_TEMP/isoko-live-playwright/node_modules/.bin/playwright" test --config=playwright.audit.config.cjs'

      - name: Commit screenshots back to the verify branch
        if: always()
        run: |
          git config user.name "isoko-live-verify"
          git config user.email "isoko-live-verify@users.noreply.github.com"
          git add -f docs/design/qa/2026-11-16-live/ docs/design/qa/language-audit/
          git commit -m "chore(qa): live verification screenshots" || echo "nothing to commit"
          git push origin "HEAD:${GITHUB_REF_NAME}"
